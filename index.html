<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>北九州四天三夜繪本風旅遊行程 🌸</title>
    <!-- Google Fonts: Huninn (粉圓) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FFFCF6',
                        ink: '#3E3A39',
                        coral: '#F2A497',
                        yamabuki: '#F6D27A',
                        mizuiro: '#A8D3E6',
                        wakatake: '#B9DAA5',
                    },
                    fontFamily: {
                        huninn: ['"Zen Maru Gothic"', 'sans-serif'],
                    },
                    boxShadow: {
                        'cute': '4px 4px 0px #3E3A39',
                        'cute-sm': '2px 2px 0px #3E3A39',
                        'cute-lg': '6px 6px 0px #3E3A39',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFFCF6;
            color: #3E3A39;
            font-family: 'Zen Maru Gothic', sans-serif;
            overflow-x: hidden;
        }
        .bordered-box {
            border: 3px solid #3E3A39;
            border-radius: 1.25rem;
            background-color: #ffffff;
        }
        .badge-label {
            border: 2px solid #3E3A39;
            border-radius: 9999px;
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            display: inline-block;
            font-size: 0.85rem;
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }
        .animate-float {
            animation: gentleFloat 3.5s ease-in-out infinite;
        }
        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .animate-float, .pop-in {
                animation: none !important;
                transition: none !important;
            }
        }
        .reduced-motion .animate-float,
        .reduced-motion .pop-in {
            animation: none !important;
            transition: none !important;
        }
        .custom-checkbox {
            width: 1.4rem;
            height: 1.4rem;
            border: 2.5px solid #3E3A39;
            border-radius: 0.4rem;
            appearance: none;
            cursor: pointer;
            position: relative;
            background-color: #fff;
        }
        .custom-checkbox:checked {
            background-color: #B9DAA5;
        }
        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #3E3A39;
            font-weight: 900;
            font-size: 1rem;
            top: -3px;
            left: 2px;
        }
    </style>
</head>
<body class="pb-24">
    <!-- 頂端固定選單 -->
    <nav class="fixed top-0 left-0 right-0 z-40 bg-[#FFFCF6] border-b-4 border-[#3E3A39] px-4 py-2.5">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="scrollToSec('home')">
                <svg width="32" height="32" viewBox="0 0 100 100" class="w-8 h-8">
                    <circle cx="50" cy="50" r="45" fill="#F2A497" stroke="#3E3A39" stroke-width="6"/>
                    <path d="M 25 35 L 75 35 M 30 25 L 70 25 M 35 35 L 35 75 M 65 35 L 65 75 M 25 48 L 75 48" stroke="#3E3A39" stroke-width="6" stroke-linecap="round"/>
                </svg>
                <span class="font-black text-lg md:text-xl text-[#3E3A39] tracking-wider">北九州之旅 ✈️</span>
            </div>
            <div class="hidden md:flex gap-3 text-sm font-bold">
                <button onclick="scrollToSec('flights')" class="px-3 py-1 rounded-full border-2 border-[#3E3A39] bg-[#A8D3E6] hover:brightness-95 shadow-cute-sm">航班</button>
                <button onclick="scrollToSec('itinerary')" class="px-3 py-1 rounded-full border-2 border-[#3E3A39] bg-[#F6D27A] hover:brightness-95 shadow-cute-sm">每日行程</button>
                <button onclick="scrollToSec('timetable')" class="px-3 py-1 rounded-full border-2 border-[#3E3A39] bg-[#F2A497] text-white hover:brightness-95 shadow-cute-sm">時刻表</button>
                <button onclick="scrollToSec('stay')" class="px-3 py-1 rounded-full border-2 border-[#3E3A39] bg-[#B9DAA5] hover:brightness-95 shadow-cute-sm">住宿/寄放</button>
                <button onclick="scrollToSec('todo')" class="px-3 py-1 rounded-full border-2 border-[#3E3A39] bg-[#F2A497] hover:brightness-95 shadow-cute-sm">清單&退稅</button>
            </div>
            <div class="flex items-center gap-2">
                <button id="motionToggle" onclick="toggleMotion()" class="text-xs bg-white border-2 border-[#3E3A39] px-2 py-1 rounded-lg font-bold shadow-cute-sm">
                    ✨ 動態: 開
                </button>
            </div>
        </div>
